# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - grounded-brain-api

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: npm ci and build
        run: |
          npm ci
          npm run build

      # Migrations run here, not on the server, so the server never needs the
      # prisma CLI. Uses Neon's direct (non-pooled) URL. A failed migration stops
      # the workflow before the new code is deployed.
      - name: Apply database migrations
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Ship only what runs in production: compiled code + runtime dependencies.
      - name: Remove dev dependencies
        run: npm prune --omit=dev

      # Zip (rather than uploading the folder) so dot-folders inside node_modules
      # survive; upload-artifact@v4 drops hidden files.
      - name: Zip artifact for deployment
        run: zip -r -q release.zip dist node_modules package.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FD28989DECE84D418854D6C001C046CF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_90CA155BC6AC4543AFECDE6131E377E0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DE5A5EF66931417A8848C2114EF44341 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'grounded-brain-api'
          slot-name: 'Production'
          package: release.zip
          