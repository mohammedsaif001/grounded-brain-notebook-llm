# Local Postgres for development. Vectors live in Pinecone, so plain Postgres is enough.
services:
  postgres:
    image: postgres:16
    container_name: grounded-brain-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=grounded-brain-notebook-llm
    ports:
      - "5434:5432"
    volumes:
      - grounded_brain_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grounded-brain-notebook-llm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  grounded_brain_data:
